<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awei's blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../../css/styles.css">
</head>

<body id="top">
    <header>
        <div class="header-inner"><a href="/" class="logo" aria-label="回到首頁"><img src="../../../assets/logo.jpg" alt=""
                    class="logo-mark" aria-hidden="true">Awei's blog</a>
            <nav><a href="/post/" class="active">文章</a><a href="/about/">關於</a></nav>
            <div class="header-actions">
                <div class="theme-pill" onclick="toggleDark()" id="theme-pill" title="切換主題">
                    <div class="pill-track is-dark" id="pill-track">
                        <div class="pill-knob"></div>
                    </div><span class="pill-label" id="pill-label">深色</span>
                </div>
            </div>
        </div>
    </header>
    <div class="main-wrap no-sidebar">
        <main data-post-detail="postgres-explain-analyze"></main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <footer>
        <div class="footer-inner">
            <div class="footer-left"><a href="/" class="logo" style="font-size:0.9rem;"><img
                        src="../../../assets/logo.jpg" alt="" class="logo-mark" aria-hidden="true">Awei's blog</a>
                <div class="footer-links"><a href="/post/">文章</a><a href="/about/">關於</a><a href="#top">Top</a></div>
            </div>
            <div class="footer-copy">© 2025 Kai Lin. 以 Lora × IBM Plex Mono 排版。</div>
            <div class="footer-right">Built with <span>♥</span> on GitHub Pages</div>
        </div>
    </footer>
    <script src="../../../js/posts-data.js" defer></script>
    <script src="../../../js/archive.js" defer></script>
    <script src="../../../js/app.js" defer></script>
</body>

</html>
